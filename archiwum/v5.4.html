<style>
/* Layout: one-screen phone game. HUD on top, pannable dungeon map in the middle, item tray and action bar under the thumb.
   Deliberately a single dark world (a dungeon at night), so there is no light theme. */
:root {
  --bg: #0c0a12;
  --panel: #17131f;
  --panel2: #221c2e;
  --line: #2f2842;
  --ink: #f1e7d3;
  --muted: #a69bbb;
  --gold: #f2b94b;
  --blood: #c93745;
  --violet: #8a6fe0;
  --font-display: "Grenze Gotisch", Georgia, serif;
  --font-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --font-num: "Pixelify Sans", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px;
  overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
#app {
  height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 7px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.hud { display: grid; gap: 5px; }
.hud-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
.hud .lbl { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
#h-score { font-size: 22px; color: var(--gold); }
#h-thr { color: var(--muted); }
#h-time { font-size: 17px; text-align: right; }
.hud-row > * { white-space: nowrap; }
@media (max-width: 380px) {
  #h-score { font-size: 19px; }
  #h-time { font-size: 15px; }
  .hud .lbl { font-size: 11px; letter-spacing: 0.04em; }
  .card h1 { font-size: 34px; }
}
.bar { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width 0.2s; }
.bar i.ok { background: #6fd38a; }
.small { font-size: 13px; color: var(--muted); }
.small b { color: var(--ink); font-weight: 500; }
.btns { display: flex; gap: 6px; }
#h-ess { display: inline-block; }
#h-ess.pulse { animation: pop 0.4s ease-out; }
@keyframes pop { 0% { transform: scale(1.4); color: #c3b2ff; } 100% { transform: scale(1); } }
.regen { color: #b9a4ff; font-size: 12px; }
.iconbtn {
  background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 8px;
  width: 36px; height: 32px; display: grid; place-items: center; cursor: pointer; flex: none;
}
.iconbtn svg { width: 18px; height: 18px; }
#stage { flex: 1; min-height: 0; position: relative; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border-radius: 8px; box-shadow: 0 0 0 1px var(--line); touch-action: none; cursor: grab; }
.hint { min-height: 2.7em; font-size: 13.5px; color: var(--muted); line-height: 1.35; }
.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.tab { font: inherit; font-size: 12.5px; padding: 6px 2px; border-radius: 7px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; white-space: nowrap; overflow: hidden; }
.tab[aria-selected="true"] { background: var(--panel2); color: var(--ink); border-color: #4a3f63; }
.tray { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.item {
  position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: var(--ink);
  padding: 5px 2px 4px; display: grid; justify-items: center; gap: 1px; font: inherit; cursor: pointer; min-width: 0;
}
.item svg.ic { width: 22px; height: 22px; }
.item .nm { font-size: 12.5px; line-height: 1.15; white-space: nowrap; overflow: hidden; max-width: 100%; }
.item .top { display: flex; align-items: center; gap: 4px; }
.item .sl { font-size: 10.5px; line-height: 1.1; color: var(--muted); white-space: nowrap; overflow: hidden; max-width: 100%; }
.item .cost { font-family: var(--font-num); color: var(--gold); font-size: 12px; display: inline-flex; align-items: center; gap: 3px; }
.item .cost::before { content: ""; width: 6px; height: 6px; background: var(--violet); transform: rotate(45deg); border-radius: 1px; }
.item .lock { position: absolute; top: 3px; right: 4px; width: 11px; height: 11px; color: var(--muted); }
.item[aria-pressed="true"] { border-color: var(--gold); background: #2b2238; box-shadow: inset 0 0 0 1px var(--gold); }
.item.off { opacity: 0.4; }
.actions { display: flex; gap: 10px; align-items: center; }
#btn-action {
  flex: 1; font: inherit; font-weight: 700; font-size: 16px; padding: 12px; border-radius: 10px; border: 0;
  background: var(--blood); color: #fff; cursor: pointer;
}
#btn-action.focus-on { background: var(--violet); }
#btn-action:disabled { background: var(--panel2); color: var(--muted); cursor: default; }
.focus { width: 70px; display: grid; gap: 3px; }
.focus span { font-size: 11px; color: var(--muted); text-align: center; }
.focus .meter { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
.focus .meter i { display: block; height: 100%; width: 100%; background: var(--violet); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.overlay {
  position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
  background: rgba(8, 6, 12, 0.84);
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px;
  width: min(440px, 100%); max-height: 100%; overflow: auto; display: grid; gap: 12px;
  -webkit-user-select: text; user-select: text;
}
.card h1, .card h2 { font-family: var(--font-display); margin: 0; line-height: 1.05; text-wrap: balance; }
.card h1 { font-size: 40px; }
.card h2 { font-size: 28px; }
.card p { margin: 0; line-height: 1.4; }
.card .sub { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; }
.card ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; line-height: 1.35; }
.modes, .choices { display: grid; gap: 8px; }
.btn {
  font: inherit; text-align: left; background: var(--panel2); border: 1px solid var(--line); color: var(--ink);
  border-radius: 10px; padding: 10px 12px; cursor: pointer; display: grid; gap: 2px;
}
.btn b { font-size: 16px; }
.btn span { color: var(--muted); font-size: 13.5px; }
.btn.primary { background: var(--blood); border-color: var(--blood); color: #fff; text-align: center; font-weight: 700; }
.btn.primary span { color: #ffd9dc; }
.btn.gold { border-color: var(--gold); }
.btn.unlock { border-color: var(--violet); }
.btn:disabled { opacity: 0.45; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row .btn { flex: 1; min-width: 140px; text-align: center; }
.field { display: grid; gap: 4px; font-size: 13.5px; color: var(--muted); }
.field input[type="text"] { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.link { background: none; border: 0; color: var(--gold); font: inherit; text-decoration: underline; cursor: pointer; padding: 0; justify-self: start; text-align: left; }
.stats { width: 100%; border-collapse: collapse; font-size: 14px; }
.stats td { padding: 4px 0; border-bottom: 1px solid var(--line); }
.stats td:last-child { text-align: right; font-family: var(--font-num); }
.slider { display: grid; gap: 2px; }
.slider label { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; color: var(--muted); }
.slider label b { color: var(--ink); font-family: var(--font-num); font-weight: 500; }
.slider input { width: 100%; accent-color: var(--gold); }
.score-big { font-family: var(--font-num); font-size: 30px; color: var(--gold); }
.note { font-size: 12.5px; color: var(--muted); }
</style>

    card.appendChild(el('h2', null, 'Pieczęć złamana'));
    card.appendChild(el('div', 'score-big', '+' + Math.round(fl.score) + ' pkt'));
    const left = run.party.filter(e => !e.dead);
    card.appendChild(el('p', null, 'Na piętro ' + (run.floor + 1) + ' schodzi ' + left.length + ' z 4: ' +
      left.map(e => HEROES[e.type].name + ' ' + Math.round(e.hp / e.max * 100) + '% HP').join(', ') + '. Po drodze odpoczną o 30% HP.' +
      (run.floor === 2 ? ' Przed bossem wypiją eliksiry: każdy dostanie tarczę równą swojemu max HP, więc każde HP zabrane teraz ułatwi finał.' : '')));
    card.appendChild(itemsTable(fl.byType));
    card.appendChild(statsTable(fl.stats));
    card.appendChild(el('p', 'note', 'Na następne piętro przechodzi ' + Math.floor(fl.essence) + ' Esencji. Ulepszenia, odblokowane pułapki i chciwość zostają, układ losuje się od nowa.'));
    card.appendChild(btn('primary', run.floor + 1 === 3 ? 'Zejdź do bossa: piętro 3' : 'Zejdź niżej: piętro ' + (run.floor + 1), null, () => { const carry = Math.floor(fl.essence); closeModal(); startFloor(run.floor + 1, carry); }));
  }
  function renderEnd(card) {
    const win = run.result === 'win';
    card.appendChild(el('div', 'sub', MODES[run.mode].name + ' · koniec runu'));
    card.appendChild(el('h2', null, win ? 'Drużyna rozbita' : 'Loch upadł'));
    card.appendChild(el('p', null, run.reason));
    if (win) card.appendChild(el('div', 'score-big', '★'.repeat(run.stars) + '☆'.repeat(3 - run.stars)));
    card.appendChild(el('div', 'score-big', 'Razem: ' + Math.round(run.total)));
    const t = el('table', 'stats');
    run.floors.forEach(f => {
      const tr = el('tr'); tr.appendChild(el('td', null, 'Piętro ' + f.floor + ' · żywych na koniec: ' + f.alive));
      tr.appendChild(el('td', null, String(f.score))); t.appendChild(tr);
    });
    card.appendChild(t);
    const f3 = run.floors.find(f => f.floor === 3);
    if (f3) card.appendChild(el('p', 'note', 'Finał: pokonani ' + f3.stats.finalKills + ' (' + f3.stats.finalPts + ' pkt), polegli wcześniej w całym runie: ' + run.floors.reduce((a, f) => a + (f.stats.earlyDeaths || 0), 0) + '.'));
    if (win) card.appendChild(el('p', 'note', 'Gwiazdki: ★ za wygraną, ★★ od ' + S.star2 + ' pkt, ★★★ od ' + S.star3 + ' pkt.'));
    const st = el('p', 'note', 'Zapisuję wynik do analizy...'); card.appendChild(st);
    saveRun().then(res => {
      st.textContent = res === 'ok' ? 'Wynik zapisany. Claude może go przeanalizować przy balansie.'
        : res === 'off' ? 'Zapis wyników jest niedostępny w tym widoku.'
        : res === 'denied' ? 'Ten widok nie ma prawa zapisu wyników. Gra działa normalnie.' : 'Nie udało się zapisać wyniku.';
    });
    const row = el('div', 'row');
    row.appendChild(btn('primary', 'Jeszcze raz', MODES[run.mode].name, () => { closeModal(); newRun(run.mode); }));
    row.appendChild(btn('', 'Zmień tryb', null, () => { closeModal(); openModal({ type: 'start' }); }));
    card.appendChild(row);
  }
  function saveRun() {
    return getDb().then(db => {
      if (!db) return 'off';
      const doc = {
        at: new Date().toISOString(), version: 13, player: (playerName || '').slice(0, 40), mode: run.mode, result: run.result,
        floorsCleared: run.floors.filter(f => f.pass).length, stars: run.stars || 0, total: Math.round(run.total), floors: run.floors,
        upgrades: run.upgrades, fires: run.fires, focusUsedSec: Math.round(run.focusUsed * 10) / 10, reviveUsed: run.reviveUsed,
        durationSec: Math.round((Date.now() - run.startedAt) / 1000), settings: Object.assign({}, S)
      };
      return db.collection('runs').add(doc).then(() => 'ok', err => (err && err.code === 'invalid_argument') ? 'denied' : 'fail');
    }).catch(() => 'fail');
  }

  /* ================= input ================= */
  function trapNear(wx, wy) {
    const tx = Math.floor(wx), ty = Math.floor(wy);
    const direct = fl.items.get(key(tx, ty));
    if (direct && ACTIVE[direct.type]) return direct;
    let best = null, bd = 0.85;
    for (const d of DIRS8) {
      const it = fl.items.get(key(tx + d[0], ty + d[1]));
      if (!it || !ACTIVE[it.type]) continue;
      const dist = Math.hypot(wx - (it.x + 0.5), wy - (it.y + 0.5));
      if (dist < bd) { bd = dist; best = it; }
    }
    return best;
  }
  function snapTile(type, wx, wy) {
    let best = null, bd = 1.0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const x = Math.floor(wx) + dx, y = Math.floor(wy) + dy;
      if (!canPlace(type, x, y)) continue;
      const d = Math.hypot(wx - (x + 0.5), wy - (y + 0.5));
      if (d < bd) { bd = d; best = [x, y]; }
    }
    return best;
  }
  function handleTap(wx, wy) {
    if (!fl || !run) return;
    if (fl.phase === 'build' && cam.s < ZOOM_TAP) {
      cam.s = closeScale(); centerOn(wx, wy); updateZoomBtn();
      setHint(selected ? 'Przybliżono. Stuknij pasujące miejsce jeszcze raz.' : 'Przybliżono. Przycisk mapy u góry wraca do całości.');
      return;
    }
    const x = Math.floor(wx), y = Math.floor(wy);
    if (x < 0 || y < 0 || x >= WW || y >= WH) return;
    const k = key(x, y), it = fl.items.get(k);
    if (fl.phase === 'build') {
      if (it) { fl.items.delete(k); fl.essence += ITEMS[it.type].cost; bt(it.type).placed--; bt(it.type).spent -= ITEMS[it.type].cost; updateTray(); setHint(ITEMS[it.type].name + ' zdjęte, Esencja wraca.'); return; }
      if (selected) { const t = snapTile(selected, wx, wy) || [x, y]; tryPlace(selected, t[0], t[1]); return; }
      const s = slotOf(x, y);
      setHint(s ? 'To miejsce: ' + SLOT_LABEL[s] + '. Wybierz na dole element, który tu pasuje.' : 'Wybierz element na dole, pasujące miejsca się podświetlą.');
      return;
    }
    if (fl.phase === 'raid' && selected) { const t = snapTile(selected, wx, wy) || [x, y]; tryPlace(selected, t[0], t[1]); }
  }
  function tryPlace(type, x, y) {
    const T = ITEMS[type];
    if (!run.unlocked.has(type)) { setHint(T.name + ' jest zablokowany.'); return false; }
    if (fl.essence < T.cost) { setHint('Za mało Esencji.'); return false; }
    if (!canPlace(type, x, y)) { setHint(T.name + ' pasuje tylko na: ' + SLOT_LABEL[T.slot] + '. Pasujące wolne miejsca są podświetlone.'); return false; }
    const hp = MONSTERS[type] ? ITEMS[type].hp * mods.monster : 0;
    fl.items.set(key(x, y), { type, x, y, cd: fl.phase === 'raid' && TRAPS[type] ? ARM_TIME : 0, anim: 0, rep: 1, disabled: false, hp, max: hp, power: mods.monster, shot: 0.5, flash: 0, preview: 1.4 });
    fl.essence -= T.cost; bt(type).placed++; bt(type).spent += T.cost;
    if (fl.phase === 'raid') fl.stats.built++;
    updateTray();
    if (fl.phase === 'raid' && type === 'loot') replanAll();
    if (ACTIVE[type]) setHint(T.name + ': podświetlony obszar to zasięg umiejętności. Stuknięcie elementu w budowie zwraca Esencję.');
    return true;
  }
  const pointers = new Map();
  let gesture = null;
  const localXY = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  cv.addEventListener('pointerdown', e => {
    if (!fl || modalOpen) return;
    e.preventDefault();
    if (fl.check && !fl.check.result && fl.check.box) {
      const q = localXY(e), b = fl.check.box;
      if (q.x >= b.x - 10 && q.x <= b.x + b.w + 10 && q.y >= b.y - 10 && q.y <= b.y + b.h + 10) { resolveCheck(); return; }
    }
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    const p = localXY(e); pointers.set(e.pointerId, p);
    if (pointers.size === 1) {
      gesture = { type: 'pan', sx: p.x, sy: p.y, ox: cam.ox, oy: cam.oy, moved: false, handled: false };
      if (fl.phase === 'raid' && run.mode !== 'check') {
        const w = toWorld(p.x, p.y);
        let it = trapNear(w.x, w.y);
        if (selected) { const d = fl.items.get(key(Math.floor(w.x), Math.floor(w.y))); it = d && ACTIVE[d.type] ? d : null; }
        if (it) { fire(it); gesture.handled = true; }
      }
    } else if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      gesture = { type: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, s0: cam.s };
    }
  });
  cv.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    const p = localXY(e); pointers.set(e.pointerId, p);
    if (!gesture) return;
    if (gesture.type === 'pinch' && pointers.size >= 2) {
      const [a, b] = [...pointers.values()];
      zoomAt(gesture.s0 * (Math.hypot(a.x - b.x, a.y - b.y) || 1) / gesture.d0, (a.x + b.x) / 2, (a.y + b.y) / 2);
    } else if (gesture.type === 'pan') {
      const dx = p.x - gesture.sx, dy = p.y - gesture.sy;
      if (!gesture.moved && Math.hypot(dx, dy) > 8) gesture.moved = true;
      if (gesture.moved) { cam.ox = gesture.ox - dx; cam.oy = gesture.oy - dy; clampCam(); }
    }
  });
  function endPointer(e) {
    if (!pointers.has(e.pointerId)) return;
    pointers.delete(e.pointerId);
    if (!gesture) return;
    if (gesture.type === 'pinch') { if (!pointers.size) gesture = null; return; }
    if (!gesture.moved && !gesture.handled && e.type === 'pointerup') { const w = toWorld(gesture.sx, gesture.sy); handleTap(w.x, w.y); }
    gesture = null;
  }
  cv.addEventListener('pointerup', endPointer);
  cv.addEventListener('pointercancel', endPointer);
  cv.addEventListener('wheel', e => {
    if (!fl) return;
    e.preventDefault();
    const p = localXY(e);
    zoomAt(cam.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), p.x, p.y);
  }, { passive: false });
  $('#btn-action').addEventListener('click', () => {
    if (!fl) return;
    if (fl.phase === 'build') { startRaid(); return; }
    if (fl.phase === 'raid' && fl.check && !fl.check.result) { resolveCheck(); return; }
    if (fl.phase === 'raid' && (run.mode === 'slow' || run.mode === 'pause')) toggleFocus();
  });
  function toggleFocus() {
    if (focusOn) focusOn = false;
    else if (focus > 0.2) focusOn = true;
    updateAction();
  }
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && fl && fl.phase === 'raid' && !modalOpen) {
      e.preventDefault();
      if (fl.check && !fl.check.result) resolveCheck();
      else if (run.mode === 'slow' || run.mode === 'pause') toggleFocus();
    }
  });
  // While a skill check is up, a tap ANYWHERE on the screen answers it and does nothing else.
  // During the "Uwaga!" warning taps are swallowed, so an early tap neither answers nor places anything.
  let swallowClickUntil = 0;
  document.addEventListener('pointerdown', e => {
    if (!fl || modalOpen || fl.phase !== 'raid' || !fl.check || fl.check.result) return;
    e.preventDefault(); e.stopPropagation();
    swallowClickUntil = performance.now() + 450;
    resolveCheck();
  }, true);
  document.addEventListener('click', e => {
    if (performance.now() < swallowClickUntil) { e.preventDefault(); e.stopPropagation(); }
  }, true);
  $('#btn-zoom').addEventListener('click', () => {
    if (!fl) return;
    if (cam.s < closeScale() * 0.92) zoomAt(closeScale(), cw / 2, ch / 2);
    else { cam.s = fitScale(); clampCam(); updateZoomBtn(); }
  });
  $('#btn-settings').addEventListener('click', () => { if (!modalOpen) openModal({ type: 'settings' }); });
  window.addEventListener('resize', () => { if (fl) resize(); });

  /* ================= boot ================= */
  // An example floor sits behind the start screen so the page is never empty.
  run = { mode: lastMode, floor: 1, total: 0, floors: [], reviveUsed: false, startedAt: Date.now(), fires: 0, focusUsed: 0, upgrades: [], unlocked: new Set(START_UNLOCKED) };
  mods = freshMods();
  startFloor(1, 0);
  openModal({ type: 'start' });
  requestAnimationFrame(frame);

  // Hook for automated checks; no effect on normal play.
  window.__yatd = { setArm: v => { ARM_TIME = v; }, costs: () => Object.fromEntries(Object.keys(ITEMS).map(k => [k, ITEMS[k].cost])), setBossDps: v => { BOSS_DPS = v; }, setRush: v => { RUSH3 = v; }, setAssault: v => { ASSAULT3 = v; }, setShield: v => { SHIELD3 = v; },
    get S() { return S; }, get fl() { return fl; }, get run() { return run; }, get mods() { return mods; }, get modalKind() { return modalKind; }, get cam() { return cam; },
    step, fire, tryPlace, canPlace, startRaid, newRun, closeModal, endFloor: () => endFloor(), finishWave: () => finishWave(), resolveCheck: p => resolveCheck(p), skipCheck: () => skipCheck(), clearCheck: () => clearCheck(), areaOf, slotOf, depthMult, shortestPath, WW, WH
  };
})();
</script>
