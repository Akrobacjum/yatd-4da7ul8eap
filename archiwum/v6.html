<style>
/* Layout: one-screen phone game. Read-only HUD on top, dungeon map in the middle (you steer the camera while building,
   it follows the party during a raid). Everything you press sits at the bottom, under the thumb: tabs, item tray,

   Deliberately a single dark world (a dungeon at night), so there is no light theme. */
:root {
  --bg: #0c0a12;

  --panel2: #221c2e;
  --line: #2f2842;

  --violet: #8a6fe0;

  --font-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --font-num: "Pixelify Sans", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px;
  overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
#app {
  height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 7px;
  padding-top: max(8px, env(safe-area-inset-top, 0px));
  padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.hud { display: grid; gap: 5px; }
.hud-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
.hud .lbl { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
#h-score { font-size: 22px; color: var(--gold); }
#h-thr { color: var(--muted); }
#h-time { font-size: 17px; text-align: right; }
.hud-row > * { white-space: nowrap; }
.hud-row > :nth-child(2) { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.lbl .ln { display: none; }
@media (max-width: 440px) {
  .lbl .lw { display: none; } .lbl .ln { display: inline; }

}

}
.bar { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; }

.btns { display: flex; gap: 6px; }

.regen { color: #b9a4ff; font-size: 12px; }
.iconbtn {

}
.iconbtn svg { width: 18px; height: 18px; }

.hint { min-height: 2.7em; font-size: 13.5px; color: var(--muted); line-height: 1.35; }

.item .top { display: flex; align-items: center; gap: 4px; }

.item .cost { font-family: var(--font-num); color: var(--gold); font-size: 12px; display: inline-flex; align-items: center; gap: 3px; }

#btn-pause { margin-left: auto; }
#btn-action {

.overlay {

.modes, .choices { display: grid; gap: 8px; }
.btn {
  font: inherit; text-align: left; background: var(--panel2); border: 1px solid var(--line); color: var(--ink);
  border-radius: 10px; padding: 10px 12px; cursor: pointer; display: grid; gap: 2px;
}
.btn b { font-size: 16px; }
.btn span { color: var(--muted); font-size: 13.5px; }
.btn.primary { background: var(--blood); border-color: var(--blood); color: #fff; text-align: center; font-weight: 700; }

.btn.gold { border-color: var(--gold); }

.row { display: flex; gap: 8px; flex-wrap: wrap; }

.stats { width: 100%; border-collapse: collapse; font-size: 14px; }
.stats td { padding: 4px 0; border-bottom: 1px solid var(--line); }

.score-big { font-family: var(--font-num); font-size: 30px; color: var(--gold); }
.note { font-size: 12.5px; color: var(--muted); }
</style>

  function genLayout() {
    for (let attempt = 0; attempt < 4000; attempt++) {
      const N = rand(10, 12);
      const cells = [[rand(0, CGX - 1), 0]], id = {}, edges = [];
      id[cells[0].join(',')] = 0;

      while (cells.length < N && guard++ < 2000) {
        const from = cells[rand(0, cells.length - 1)], d = DIRS[rand(0, 3)];
        const tx = from[0] + d[0], ty = from[1] + d[1];
        if (tx < 0 || tx >= CGX || ty < 0 || ty >= CGY) continue;
        const k = tx + ',' + ty;
        if (id[k] !== undefined) continue;
        id[k] = cells.length; cells.push([tx, ty]);
        edges.push([id[from.join(',')], id[k]]);
      }
      if (cells.length < N) continue;
      const has = {};
      edges.forEach(e => { has[Math.min(e[0], e[1]) + '-' + Math.max(e[0], e[1])] = 1; });
      const cand = [];
      cells.forEach((c, i) => [[1, 0], [0, 1]].forEach(d => {
        const j = id[(c[0] + d[0]) + ',' + (c[1] + d[1])];
        if (j !== undefined && !has[Math.min(i, j) + '-' + Math.max(i, j)]) cand.push([i, j]);
      }));
      shuffle(cand);
      const extra = rand(2, 3);   // a few loops, so there is more than one way around
      for (let e = 0; e < cand.length && e < extra; e++) edges.push(cand[e]);
      const adj = cells.map(() => []);
      edges.forEach(e => { adj[e[0]].push(e[1]); adj[e[1]].push(e[0]); });

      const q = [0];
      while (q.length) { const c = q.shift(); adj[c].forEach(n => { if (dist[n] < 0) { dist[n] = dist[c] + 1; q.push(n); } }); }
      const maxD = Math.max(...dist);
      if (maxD < (attempt < 2000 ? 5 : 4)) continue;
      const far = []; dist.forEach((v, i) => { if (v === maxD) far.push(i); });
      return { cells, edges, dist, maxD, heart: far[rand(0, far.length - 1)] };
    }

      }

  // Floors 1-2: a dead hero no longer pays, but his soul feeds the dungeon, his gear spills out as loot

    fl.stats.kills++;
    if (kind === 'boss') fl.stats.bossKills++; else if (kind === 'monster') fl.stats.killsMon++; else fl.stats.killsTrap++;
    if (attr) bt(attr).kills++;

      fl.score += pts; fl.stats.finalKills++; fl.stats.finalPts += pts;

      const s = spots.find(t => walkable(t[0], t[1]) && !fl.items.has(key(t[0], t[1])));
      if (!s) return;
      const type = it.r === 3 ? 'loot3' : it.r === 2 ? 'loot2' : 'loot';
      fl.items.set(key(s[0], s[1]), { type, x: s[0], y: s[1], cd: 0, anim: 0, disabled: false, hp: 0, max: 0, power: 1, shot: 0, flash: 0, preview: 0, dropped: true });

  /* ================= loot and hero gear ================= */
  function rollItem(r) {
    const types = Object.keys(HITEMS), total = types.reduce((a, t) => a + HITEMS[t].w, 0);
    let x = Math.random() * total, t = types[0];
    for (const k of types) { x -= HITEMS[k].w; if (x <= 0) { t = k; break; } }
    return { type: t, r, charges: t === 'charm' ? (r === 3 ? 2 : 1) : 1 };
  }
  function itemLabel(it) { const H = HITEMS[it.type]; return H.name + (it.r > 1 ? ' (' + ADJ[H.g][it.r] + ')' : ''); }

  function giveItem(h, it) {
    if (h.inv.length >= 3) {
      let low = 0; h.inv.forEach((o, i) => { if (o.r < h.inv[low].r) low = i; });
      if (h.inv[low].r >= it.r) { say(h, 'Nie mam już miejsca.', 1); return; }
      h.inv.splice(low, 1);
    }
    h.inv.push(it); fl.stats.itemsGot++;
    say(h, 'Mam ' + itemAcc(it) + '!', it.r >= 2 ? 3 : 2);
  }
  function pickup(h, it) {
    const r = ITEMS[it.type].rarity || 1;

    const room = roomOf(it.x, it.y);
    fl.greed = Math.min(4, fl.greed + [0, 0.2, 0.4, 0.8][r] * mods.greedMult); run.greed = fl.greed;
    const pts = 25 * r * depthMult(room) * infMult();
    fl.score += pts; fl.stats.loot++; fl.stats.lootPts += pts;
    floatTile(it.x, it.y, '+' + Math.round(pts) + ' łup', RARITY_COLOR[r], 16);
    floatHero(h, 'Chciwość ×' + fmt2(fl.greed), '#f2b94b', 14, -0.6);
    giveItem(h, rollItem(r));
    if (mods.lootTrap > 0) damage(h, mods.lootTrap * r, LOOTTRAP);
    if (r === 3 && !it.dropped) gainEssence(null, 6, 'essDrop');
    if (!it.dropped && fl.choices < S.upgradeLimit) { fl.choices++; queueModal({ type: 'upgrade', rarity: r }); }

  /* ================= traps ================= */
  // A trap that went off in front of the heroes, or one the thief/amulet spotted, is known: they avoid it if they can.
  function learnTrap(it, how, by) {
    if (it.detected) return;
    it.detected = true; fl.threatDirty = true;
    if (how === 'seen') { fl.stats.learned++; floatTile(it.x, it.y, 'Zapamiętali', '#ffe066', 12, -0.5); }
    if (by) say(by, how === 'seen' ? pick(SAY.learn) : (by.inv.some(x => x.type === 'amulet') && by.type !== 'thief' ? pick(SAY.amulet) : pick(SAY.detect)), 2);
  }
  // Path cost of known traps: loaded ones are avoided hard, reloading ones barely.
  function rebuildThreat() {
    fl.threatDirty = false;

    fl.items.forEach(it => {
      if (!TRAPS[it.type] || !it.detected || it.disabled) return;
      const w = it.cd > 0.3 ? 0.4 : 4;
      areaOf(it).forEach(t => { const i = t[1] * WW + t[0]; fl.danger[i] = Math.min(6, fl.danger[i] + w); });
    });
    replanAll();
  }
  function disarmSpots(it) {
    const x = it.x, y = it.y;
    if (it.type === 'spikes' || it.type === 'web' || it.type === 'gate') return [[x, y]];
    if (it.type === 'arrows' || it.type === 'fire') return wallDirs(x, y).map(d => [x + d[0], y + d[1]]);
    return DIRS.map(d => [x + d[0], y + d[1]]).filter(t => walkable(t[0], t[1]));
  }

    if (fl.time - fl.lastTrapAt < S.comboWin) { if (fl.lastTrapType !== it.type) fl.combo = Math.min(7, fl.combo + 1); }   // only a different trap type builds combo

    run.fires++;

        });

        it.uses = (it.uses || 0) + 1;
        if (it.uses >= mods.gateUses) { it.disabled = true; fl.threatDirty = true; floatTile(it.x, it.y, 'Ostatnie zamknięcie', '#c9c2d8', 13, -0.6); }
        fl.heroes.forEach(h => {
          if (h.dead || h.fled) return;

        });

        burst(it.x + 0.5, it.y + 0.5, '#ff9a3c', 26); burst(it.x + 0.5, it.y + 0.5, '#ffd27a', 12);

      }

  function hurtMonster(m, dmg) {

      floatTile(m.x, m.y, ITEMS[m.type].name + ' pada', '#9be37a', 14);
      burst(m.x + 0.5, m.y + 0.5, '#7fbf5a', 10);

        // it stays down while a hero stands over it, so a wall of monsters can be broken one by one
        if (m.downUntil && fl.time >= m.downUntil && !alive().some(h => Math.max(Math.abs(h.tx - m.x), Math.abs(h.ty - m.y)) <= 2)) { m.hp = m.max; m.downUntil = 0; floatTile(m.x, m.y, 'Wstaje!', '#9be37a', 13, -0.6); replanAll(); }

        if (MONSTERS[o.type] && o.hp > 0 && o.hp < o.max && Math.max(Math.abs(o.x - m.x), Math.abs(o.y - m.y)) <= 2) o.hp = Math.min(o.max, o.hp + 8 * dt);

          if (tgt) { m.shot = 1.2; const p = heroPos(tgt); fxLine(m.x + 0.5, m.y + 0.5, p.x, p.y, 0.15); damage(tgt, 9 * S.dmg * m.power, m); }

  /* ================= heroes: the party brain ================= */
  // The party has a leader who picks where to go, calls retreats and the final push. The others follow,
  // but each has a job: the thief scouts and disarms, the priest heals and shields, the mage burns monsters
  // and webs, the warrior charges monsters and raises his shield in known traps. They only know what they have seen.
  function replanAll() { if (fl) fl.heroes.forEach(h => { h.needPlan = true; }); }
  const byId = id => fl.heroes.find(h => h.id === id);
  const tIdx = h => h.ty * WW + h.tx;
  const hdist = (a, b) => { const p = heroPos(a), q = heroPos(b); return Math.hypot(p.x - q.x, p.y - q.y); };
  const panicking = h => fl.time < h.panicUntil;
  function leader() {
    const P = fl.party;
    let L = byId(P.leaderId);
    if (!L || L.dead || L.lost || panicking(L)) {

      for (const t of LEADER_ORDER) { const h = alive().find(o => o.type === t && !o.lost && !panicking(o)); if (h) { L = h; break; } }
      if (!L) L = alive()[0] || null;

    }

  }

    const P = fl.party;

  }

    P.queueSay = (P.queueSay || []).concat(lines.map((t, i) => ({ id: (crew[i % Math.max(1, crew.length)] || {}).id, text: t, at: fl.time + i * 0.65 })));
  }

  function lootSeen(it) {

  /* ================= Esencja ================= */
  // A starting pool, slow regeneration during the raid, and fear: hurting heroes feeds the dungeon.

  function gainEssence(h, amt, stat) {
    if (amt <= 0) return;
    const before = Math.floor(fl.essence);
    const add = Math.max(0, Math.min(S.essenceCap - fl.essence, amt * mods.regen));
    fl.essence += add; fl.stats[stat] = (fl.stats[stat] || 0) + add;

      h.orbAcc += add;
      const p = heroPos(h), T = cam.s;

  /* ================= sound ================= */

      const cfg = { warn: [880, 'triangle', 0.12, 1320], go: [1480, 'square', 0.04], crit: [220, 'square', 0.22, 55], ok: [620, 'sine', 0.14, 520], miss: [150, 'sawtooth', 0.18, 70] }[type];

  /* ================= simulation step (game time) ================= */
  function step(dt) {
    fl.time += dt;

      fl.spawnTimer -= dt;
      if (fl.spawnTimer <= 0) { spawnHero(fl.queue.shift()); fl.spawnTimer = 1.0; }
    }
    fl.items.forEach(it => {
      if (it.cd > 0) { it.cd = Math.max(0, it.cd - dt); if (it.detected && it.cd <= 0.3 && it.cd + dt > 0.3) fl.threatDirty = true; }
      if (it.anim > 0) it.anim = Math.max(0, it.anim - dt);

    if (fl.zones.length) fl.zones = fl.zones.filter(z => z.until > fl.time);
    regenTick(dt);
    if (fl.silence) fl.stats.silenceTime += dt;
    if (fl.threatDirty) rebuildThreat();
    fl.doors.forEach(d => { if (d.wasClosed && d.closedUntil <= fl.time) { d.wasClosed = false; replanAll(); } });

  /* ================= main loop (real time) ================= */

  function renderFloor(card) {

  function saveRun() {

  /* ================= input ================= */
  function trapNear(wx, wy) {
    const tx = Math.floor(wx), ty = Math.floor(wy);
    const direct = fl.items.get(key(tx, ty));
    if (direct && ACTIVE[direct.type]) return direct;
    let best = null, bd = 0.85;
    for (const d of DIRS8) {
      const it = fl.items.get(key(tx + d[0], ty + d[1]));
      if (!it || !ACTIVE[it.type]) continue;
      const dist = Math.hypot(wx - (it.x + 0.5), wy - (it.y + 0.5));
      if (dist < bd) { bd = dist; best = it; }
    }
    return best;
  }
  function snapTile(type, wx, wy) {
    let best = null, bd = 1.0;

      const x = Math.floor(wx) + dx, y = Math.floor(wy) + dy;
      if (!canPlace(type, x, y)) continue;
      const d = Math.hypot(wx - (x + 0.5), wy - (y + 0.5));
      if (d < bd) { bd = d; best = [x, y]; }
    }
    return best;
  }
  function handleTap(wx, wy) {
    if (!fl || !run) return;
    const x = Math.floor(wx), y = Math.floor(wy);
    if (x < 0 || y < 0 || x >= WW || y >= WH) return;
    const k = key(x, y), it = fl.items.get(k);
    if (fl.phase === 'build') {
      if (it) { fl.items.delete(k); fl.essence += ITEMS[it.type].cost; bt(it.type).placed--; bt(it.type).spent -= ITEMS[it.type].cost; updateTray(); setHint(ITEMS[it.type].name + ' zdjęte, Esencja wraca.'); return; }
      if (selected) { const t = snapTile(selected, wx, wy) || [x, y]; tryPlace(selected, t[0], t[1]); return; }
      const s = slotOf(x, y);
      setHint(s ? 'To miejsce: ' + SLOT_LABEL[s] + '. Wybierz na dole element, który tu pasuje.' : 'Wybierz element na dole, pasujące miejsca się podświetlą.');
      return;
    }
    if (fl.phase !== 'raid') return;
    if (selected) { const t = snapTile(selected, wx, wy) || [x, y]; tryPlace(selected, t[0], t[1]); return; }

      const tr = trapNear(wx, wy);

        tr.sleep = !tr.sleep; if (tr.sleep) { fl.stats.slept++; bt(tr.type).slept++; }

        setHint(ITEMS[tr.type].name + (tr.sleep ? ' uśpione: nie będzie z nich skill checków. Stuknij jeszcze raz, żeby obudzić.' : ' obudzone.'));
      }
    }
  }
  function tryPlace(type, x, y) {
    const T = ITEMS[type];
    if (!run.unlocked.has(type)) { setHint(T.name + ' jest zablokowany.'); return false; }
    if (fl.essence < T.cost) { setHint('Za mało Esencji.'); return false; }
    if (!canPlace(type, x, y)) { setHint(T.name + ' pasuje tylko na: ' + SLOT_LABEL[T.slot] + '. Pasujące wolne miejsca są podświetlone.'); return false; }
    const hp = MONSTERS[type] ? ITEMS[type].hp * mods.monster : 0;
    fl.items.set(key(x, y), { type, x, y, cd: fl.phase === 'raid' && TRAPS[type] ? ARM_TIME : 0, anim: 0, disabled: false, hp, max: hp, power: mods.monster, shot: 0.5, flash: 0, preview: 1.4 });
    fl.essence -= T.cost; bt(type).placed++; bt(type).spent += T.cost;
    if (fl.phase === 'raid') {
      fl.stats.built++;
      // built in plain sight: whoever stands in that room (or within 3 tiles) sees it appear
      const it = fl.items.get(key(x, y)), r = roomOf(x, y);
      const witness = TRAPS[type] && alive().find(h => (r >= 0 && h.room === r && fl.rooms[r].kind === 'room') || Math.hypot(h.tx - x, h.ty - y) <= 3);
      if (witness) { learnTrap(it, 'seen', null); fl.stats.seenBuilt = (fl.stats.seenBuilt || 0) + 1; say(witness, pick(['Widziałem to! Ściana się ruszyła!', 'Coś tam się pojawiło!', 'Loch zastawia na nas pułapki!']), 3); }
    }
    updateTray();
    if (fl.phase === 'raid' && isLoot(type)) replanAll();
    if (ACTIVE[type]) setHint(T.name + ': podświetlony obszar to zasięg. Stuknięcie elementu w budowie zwraca Esencję.');
    return true;
  }
  const pointers = new Map();
  let gesture = null;
  const localXY = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  cv.addEventListener('pointerdown', e => {
    if (!fl || modalOpen) return;
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    const p = localXY(e); pointers.set(e.pointerId, p);
    if (pointers.size === 1) {

      if (fl.phase === 'raid' && run.mode !== 'check' && !paused) {
        const w = toWorld(p.x, p.y);
        let it = trapNear(w.x, w.y);
        if (selected) { const d = fl.items.get(key(Math.floor(w.x), Math.floor(w.y))); it = d && ACTIVE[d.type] ? d : null; }

      }
    } else if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      gesture = { type: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, s0: cam.s };
      cam.manualUntil = realNow + 5;
    }
  });
  cv.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    const p = localXY(e); pointers.set(e.pointerId, p);

      const [a, b] = [...pointers.values()];

  $('#btn-action').addEventListener('click', () => {
    if (!fl) return;

  }, true);
  $('#btn-zoom').addEventListener('click', () => {
    if (!fl) return;

    cam.manualUntil = realNow + 6;
  });

  run = { mode: lastMode, floor: 1, total: 0, floors: [], reviveUsed: false, startedAt: Date.now(), fires: 0, upgrades: [], unlocked: new Set(START_UNLOCKED), party: makeParty(), greed: 1, checkHints: 3 };
  mods = freshMods();
  startFloor(1, 0);

  requestAnimationFrame(frame);

  // Hook for automated checks; no effect on normal play.
  window.__yatd = { setArm: v => { ARM_TIME = v; }, costs: () => Object.fromEntries(Object.keys(ITEMS).map(k => [k, ITEMS[k].cost])), setBossDps: v => { BOSS_DPS = v; }, setShield: v => { SHIELD3 = v; },
