<style>
/* Layout: one-screen phone game. HUD strip on top, dungeon canvas in the middle, item tray and action bar under the thumb. Deliberately single dark world (dungeon at night). */
:root {
  --bg: #0c0a12;
  --panel: #17131f;
  --panel2: #221c2e;
  --line: #2f2842;
  --ink: #f1e7d3;
  --muted: #a69bbb;
  --gold: #f2b94b;
  --blood: #c93745;
  --torch: #ff9a3c;
  --violet: #8a6fe0;
  --font-display: "Grenze Gotisch", Georgia, serif;
  --font-body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --font-num: "Pixelify Sans", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  overflow: hidden;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
#app {
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.hud { display: grid; gap: 5px; }
.hud-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-width: 0; }
.hud .lbl { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
#h-score { font-size: 22px; color: var(--gold); }
#h-thr { color: var(--muted); }
#h-time { font-size: 18px; }
.bar { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width 0.2s; }
.bar i.ok { background: #6fd38a; }
.small { font-size: 13px; color: var(--muted); }
.small b { color: var(--ink); font-weight: 500; }
.iconbtn {
  background: var(--panel); border: 1px solid var(--line); color: var(--ink); border-radius: 8px;
  width: 36px; height: 32px; display: grid; place-items: center; cursor: pointer; flex: none;
}
.iconbtn svg { width: 18px; height: 18px; }
#stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
canvas { display: block; border-radius: 6px; box-shadow: 0 0 0 1px var(--line); touch-action: none; }
.hint { min-height: 2.7em; font-size: 13.5px; color: var(--muted); line-height: 1.35; }
.tray { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.item {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: var(--ink);
  padding: 6px 2px 5px; display: grid; justify-items: center; gap: 1px; font: inherit; font-size: 12.5px; cursor: pointer; min-width: 0;
}
.item svg { width: 26px; height: 26px; }
.item .cost { font-family: var(--font-num); color: var(--gold); font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
.item .cost::before { content: ""; width: 7px; height: 7px; background: var(--violet); transform: rotate(45deg); border-radius: 1px; }
.item[aria-pressed="true"] { border-color: var(--gold); background: #2b2238; box-shadow: inset 0 0 0 1px var(--gold); }
.item:disabled { opacity: 0.38; cursor: default; }
.actions { display: flex; gap: 10px; align-items: center; }
#btn-action {
  flex: 1; font: inherit; font-weight: 700; font-size: 16px; padding: 12px; border-radius: 10px; border: 0;
  background: var(--blood); color: #fff; cursor: pointer;
}
#btn-action.focus-on { background: var(--violet); }
#btn-action:disabled { background: var(--panel2); color: var(--muted); cursor: default; }
.focus { width: 70px; display: grid; gap: 3px; }
.focus span { font-size: 11px; color: var(--muted); text-align: center; }
.focus .meter { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
.focus .meter i { display: block; height: 100%; width: 100%; background: var(--violet); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.overlay {
  position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
  background: rgba(8, 6, 12, 0.84);
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px;
  width: min(440px, 100%); max-height: 100%; overflow: auto; display: grid; gap: 12px;
  -webkit-user-select: text; user-select: text;
}
.card h1, .card h2 { font-family: var(--font-display); margin: 0; line-height: 1.05; text-wrap: balance; }
.card h1 { font-size: 40px; color: var(--ink); }
.card h2 { font-size: 28px; }
.card p { margin: 0; line-height: 1.4; }
.card .sub { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; }
.card ol { margin: 0; padding-left: 20px; display: grid; gap: 4px; line-height: 1.35; color: var(--ink); }
.modes { display: grid; gap: 8px; }
.btn {
  font: inherit; text-align: left; background: var(--panel2); border: 1px solid var(--line); color: var(--ink);
  border-radius: 10px; padding: 10px 12px; cursor: pointer; display: grid; gap: 2px;
}
.btn b { font-size: 16px; }
.btn span { color: var(--muted); font-size: 13.5px; }
.btn.primary { background: var(--blood); border-color: var(--blood); color: #fff; text-align: center; font-weight: 700; }
.btn.gold { border-color: var(--gold); }
.btn:disabled { opacity: 0.45; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row .btn { flex: 1; min-width: 140px; text-align: center; }
.field { display: grid; gap: 4px; font-size: 13.5px; color: var(--muted); }
.field input[type="text"] {
  font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
}
.link { background: none; border: 0; color: var(--gold); font: inherit; text-decoration: underline; cursor: pointer; padding: 0; justify-self: start; }
.stats { width: 100%; border-collapse: collapse; font-size: 14px; }
.stats td { padding: 4px 0; border-bottom: 1px solid var(--line); }
.stats td:last-child { text-align: right; font-family: var(--font-num); }
.slider { display: grid; gap: 2px; }
.slider label { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--muted); }
.slider label b { color: var(--ink); font-family: var(--font-num); font-weight: 500; }
.slider input { width: 100%; accent-color: var(--gold); }
.choices { display: grid; gap: 8px; }
.score-big { font-family: var(--font-num); font-size: 30px; color: var(--gold); }
.note { font-size: 12.5px; color: var(--muted); }
</style>

    var win = run.result === 'win';
    card.appendChild(el('div', 'sub', MODES[run.mode].name + ' · koniec runu'));
    card.appendChild(el('h2', null, win ? 'Loch przetrwał' : 'Loch upadł'));
    card.appendChild(el('p', null, run.reason));
    card.appendChild(el('div', 'score-big', 'Razem: ' + Math.round(run.total)));
    var t = el('table', 'stats');
    run.floors.forEach(function (f) {
      var tr = el('tr'); tr.appendChild(el('td', null, 'Piętro ' + f.floor + (f.pass ? ' · zaliczone' : ' · nie')));
      tr.appendChild(el('td', null, f.score + ' / ' + f.thr)); t.appendChild(tr);
    });
    card.appendChild(t);
    var st = el('p', 'note', 'Zapisuję wynik do analizy...'); card.appendChild(st);
    saveRun().then(function (res) {
      st.textContent = res === 'ok' ? 'Wynik zapisany. Claude może go przeanalizować przy balansie.'
        : res === 'off' ? 'Zapis wyników jest niedostępny w tym widoku.'
        : res === 'denied' ? 'Ten widok nie ma prawa zapisu wyników. Gra działa normalnie.' : 'Nie udało się zapisać wyniku.';
    });
    var row = el('div', 'row');
    row.appendChild(btn('primary', 'Jeszcze raz', MODES[run.mode].name, function () { closeModal(); newRun(run.mode); }));
    row.appendChild(btn('', 'Zmień tryb', null, function () { closeModal(); openModal({ type: 'start' }); }));
    card.appendChild(row);
  }
  function saveRun() {
    return getDb().then(function (db) {
      if (!db) return 'off';
      var doc = {
        at: new Date().toISOString(), player: (playerName || '').slice(0, 40), mode: run.mode, result: run.result,
        floorsCleared: run.floors.filter(function (f) { return f.pass; }).length, total: Math.round(run.total),
        floors: run.floors, upgrades: run.upgrades, fires: run.fires, focusUsedSec: Math.round(run.focusUsed * 10) / 10,
        reviveUsed: run.reviveUsed, durationSec: Math.round((Date.now() - run.startedAt) / 1000), settings: Object.assign({}, S), version: 1
      };
      return db.collection('runs').add(doc).then(function () { return 'ok'; }, function (err) { return err && err.code === 'invalid_argument' ? 'denied' : 'fail'; });
    }).catch(function () { return 'fail'; });
  }

  /* ---------- input ---------- */
  cv.addEventListener('pointerdown', function (e) {
    if (!fl || modalOpen) return;
    e.preventDefault();
    var r = cv.getBoundingClientRect();
    var c = Math.floor((e.clientX - r.left) / tile), rr = Math.floor((e.clientY - r.top) / tile);
    if (c < 0 || c >= COLS || rr < 0 || rr >= ROWS) return;
    var it = fl.items.get(key(c, rr));
    if (fl.phase === 'build') {
      if (it) { fl.items.delete(key(c, rr)); fl.essence += ITEMS[it.type].cost; updateTray(); return; }
      if (selected) tryPlace(selected, c, rr);
      return;
    }
    if (fl.phase === 'raid') {
      if (it && TRAPS[it.type]) { fire(it); return; }
      if (selected) tryPlace(selected, c, rr);
    }
  });
  function tryPlace(type, c, r) {
    var T = ITEMS[type];
    if (fl.essence < T.cost) { setHint('Za mało Esencji.'); return; }
    if (!canPlace(type, c, r)) { setHint(T.onPath && !T.adj ? T.name + ' stawiasz tylko na ścieżce.' : T.name + ' stawiasz na ścieżce albo tuż obok niej.'); return; }
    var k = key(c, r), i = fl.idx.has(k) ? fl.idx.get(k) : -1;
    var hp = type === 'goblin' ? 45 * mods.goblin : 0;
    fl.items.set(k, { type: type, c: c, r: r, i: i, adjTo: i < 0 ? adjPathIndex(c, r) : -1, cd: 0, anim: 0, webT: 0, rep: 1, disabled: false, hp: hp, max: hp });
    fl.essence -= T.cost;
    updateTray();
  }
  $('#btn-action').addEventListener('click', function () {
    if (!fl) return;
    if (fl.phase === 'build') { startRaid(); return; }
    if (fl.phase === 'raid' && run.mode !== 'none') toggleFocus();
  });
  function toggleFocus() {
    if (focusOn) focusOn = false;
    else if (focus > 0.2) focusOn = true;
    updateAction();
  }
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' && fl && fl.phase === 'raid' && run.mode !== 'none' && !modalOpen) { e.preventDefault(); toggleFocus(); }
  });
  $('#btn-settings').addEventListener('click', function () { if (!modalOpen) openModal({ type: 'settings' }); });
  window.addEventListener('resize', function () { if (fl) resize(); });

  /* ---------- boot ---------- */
  // Example layout behind the start screen so the page is never empty.
  run = { mode: lastMode, floor: 1, total: 0, floors: [], reviveUsed: false, startedAt: Date.now(), fires: 0, focusUsed: 0, upgrades: [] };
  mods = { spikeDmg: 1, cooldown: 1, barrelR: 1, webDur: 1, greedStep: 0.25, depthBonus: 0, lootTrap: 0, goblin: 1, disarm: 1, bossDmg: 1 };
  startFloor(1, 0);
  openModal({ type: 'start' });
  requestAnimationFrame(frame);

  // Test hook for automated checks (no effect in normal play).
  window.__yatd = { endFloor: function () { endFloor(); }, get fl() { return fl; }, get run() { return run; }, get mods() { return mods; }, step: step, fire: fire, tryPlace: tryPlace, startRaid: startRaid, newRun: newRun, closeModal: closeModal, get modalKind() { return modalKind; } };
})();
</script>
